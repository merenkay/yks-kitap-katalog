<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YKS Kitap Kataloğum</title>
<meta name="description" content="YKS TYT/AYT kitaplarımın ikinci el satış kataloğu">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <h1>📚 YKS Kitap Kataloğum</h1>
  <p>Kullandığım TYT / AYT kaynak kitaplarının ikinci el satış listesi</p>
</header>

<div class="filters">
  <select id="gradeFilter" aria-label="Sınıf filtresi">
    <option value="all">Tüm Sınıflar</option>
    <option value="9">9. Sınıf</option>
    <option value="10">10. Sınıf</option>
    <option value="11">11. Sınıf</option>
    <option value="12">12. Sınıf</option>
    <option value="Genel">Genel</option>
  </select>

  <select id="examFilter" aria-label="Sınav türü filtresi">
    <option value="all">TYT / AYT (Tümü)</option>
    <option value="TYT">TYT</option>
    <option value="AYT">AYT</option>
    <option value="TYT-AYT">TYT + AYT (Genel)</option>
  </select>

  <select id="subjectFilter" aria-label="Branş filtresi">
    <option value="all">Tüm Branşlar</option>
  </select>

  <select id="sortFilter" aria-label="Fiyata göre sırala">
    <option value="default">Sıralama: Varsayılan</option>
    <option value="price-asc">Fiyat: Artan</option>
    <option value="price-desc">Fiyat: Azalan</option>
  </select>

  <input type="text" id="searchInput" class="search-box" placeholder="Kitap adında ara...">

  <label class="checkbox">
    <input type="checkbox" id="hideSoldCheckbox" checked>
    Satılanları gizle
  </label>

  <button class="btn btn--reset" id="resetFilters" type="button">Filtreleri Temizle</button>

  <span class="result-count" id="resultCount"></span>
</div>

<main>
  <div class="grid" id="bookGrid"></div>
  <p class="empty-state" id="emptyState">Bu filtrelere uyan kitap bulunamadı.</p>
</main>

<footer>
  Bu katalog kişisel ikinci el kitap satışları içindir. Fiyatlar ve stok durumu değişebilir.
</footer>

<!-- Detay Modalı -->
<div class="modal" id="bookModal" aria-hidden="true">
  <div class="modal__backdrop" id="modalBackdrop"></div>
  <div class="modal__dialog" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <button class="modal__close" id="modalClose" aria-label="Kapat">✕</button>
    <div class="modal__body">
      <div class="modal__gallery">
        <button class="gallery-nav gallery-nav--prev" id="modalPrev" aria-label="Önceki görsel">‹</button>
        <img id="modalGalleryImg" src="" alt="Kitap görseli">
        <button class="gallery-nav gallery-nav--next" id="modalNext" aria-label="Sonraki görsel">›</button>
        <div class="gallery-dots" id="modalDots"></div>
      </div>
      <div class="modal__details">
        <div class="badges" id="modalBadges"></div>
        <h2 id="modalTitle"></h2>
        <p class="modal__condition" id="modalCondition"></p>
        <p class="modal__description" id="modalDescription"></p>
        <div class="modal__prices">
          <p class="modal__original" id="modalOriginalPrice"></p>
          <p class="modal__sell" id="modalSellPrice"></p>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
